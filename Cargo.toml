[workspace]
resolver = "3"
members = ["crates/*", "templates/channel"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["The okbot contributors"]
repository = "https://github.com/tidusvn05/okbot"
homepage = "https://github.com/tidusvn05/okbot"
keywords = ["chatbot", "agent", "zalo", "okbase", "llm"]
categories = ["command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in this code base (see AGENTS.md).
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
single_match_else = "allow"
many_single_char_names = "allow"   # crypto code follows the specs' names (n, e, h, c, s)
doc_markdown = "allow"
struct_excessive_bools = "allow"   # capability flags are naturally booleans
unwrap_used = "warn"

[workspace.dependencies]
# Internal crates.
okbot-core = { path = "crates/okbot-core", version = "0.1.0-dev" }
okbot-config = { path = "crates/okbot-config", version = "0.1.0-dev" }
okbot-render = { path = "crates/okbot-render", version = "0.1.0-dev" }
okbot-store = { path = "crates/okbot-store", version = "0.1.0-dev" }
okbot-agent = { path = "crates/okbot-agent", version = "0.1.0-dev" }
okbot-knowledge = { path = "crates/okbot-knowledge", version = "0.1.0-dev" }
okbot-runtime = { path = "crates/okbot-runtime", version = "0.1.0-dev" }
okbot-channel-console = { path = "crates/okbot-channel-console", version = "0.1.0-dev" }
okbot-channel-zalo = { path = "crates/okbot-channel-zalo", version = "0.1.0-dev" }
okbot-channel-gchat = { path = "crates/okbot-channel-gchat", version = "0.1.0-dev" }
okbot-channel-discord = { path = "crates/okbot-channel-discord", version = "0.1.0-dev" }
okbot-channel-slack = { path = "crates/okbot-channel-slack", version = "0.1.0-dev" }
okbot-channel-bridge = { path = "crates/okbot-channel-bridge", version = "0.1.0-dev" }
okbot-testkit = { path = "crates/okbot-testkit", version = "0.1.0-dev" }

# External crates (ADR 0005 covers the git dependencies).
# Agent CLI adapters (formerly agent-core).
agent-call = "0.4.1"
okbase = { git = "https://github.com/tidusvn05/okbase", tag = "v0.2.3", version = "0.2.3" }
okbase-mcp = { git = "https://github.com/tidusvn05/okbase", tag = "v0.2.3", version = "0.2.3" }
# Zalo Bot API client (unofficial); ring is installed by okbot, so no default TLS provider.
zalo-bot = { version = "0.1", default-features = false }
include_dir = "0.7"
# Same minor as okbase-mcp, so one rmcp is linked.
rmcp = { version = "~3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"   # same minor as okbase
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "io-std", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
jiff = { version = "0.2", features = ["serde"] }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }   # must match okbase (libsqlite3-sys links once)
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
rand = "0.10"
twilight-gateway = { version = "0.17", default-features = false, features = ["rustls-webpki-roots", "twilight-http", "zstd"] }
twilight-http = { version = "0.17", default-features = false, features = ["decompression", "rustls-webpki-roots"] }
twilight-model = "0.17"
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "server", "rustls-webpki-roots", "ring", "rand", "sha1_smol"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
# TLS: rustls with ring only (installed as the process default, see okbot-cli main).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Already linked through rustls; used directly for Google service-account and ID-token JWTs.
ring = "0.17"
tempfile = "3"
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"
assert_cmd = "2"
tower = { version = "0.5", default-features = false, features = ["util"] }

# Line tables keep backtraces useful while cutting target/ to a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
