# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true
# The platforms okbot is released for (.github/workflows/release.yml, the Linux container image).
# Windows-only dependencies are not checked: rustyline's clipboard-win is BSL-1.0.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `ttf-parser` (font tables inside PDFs) arrives through okbase's import feature (pdf-inspector),
    # which okbase-mcp enables by default. Unmaintained, no known vulnerability; okbase ignores it
    # for the same reason. Drop this when okbase does.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained font parser via okbase import; no known vulnerability" },
    # zip yanked every 8.x release when 9.0.1 fixed several parsing bugs (no RUSTSEC advisory).
    # It arrives through okbase-convert → anydoc, which requires `zip ^8.6.0`; okbot reads Word,
    # PowerPoint and EPUB files only for `knowledge_add` (owner/admins). Drop this when anydoc moves
    # to zip 9 and okbase follows.
    { crate = "zip@8.6.0", reason = "yanked; anydoc (via okbase-convert) requires zip ^8.6.0" },
    # Same zip 8.x: unsafe permission bits and symlinks when *extracting* archives to disk
    # (`ZipArchive::extract`, `ZipStreamReader::extract`). anydoc, calamine and okbase only read
    # entries in memory; nothing in the tree calls extract. Drop with the zip@8.6.0 entry.
    { id = "RUSTSEC-2026-0367", reason = "zip extract() only; never called (entries read in memory)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() only; never called (entries read in memory)" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() only; never called (entries read in memory)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[[licenses.exceptions]]
# The embedded chart fonts are Noto Sans and Noto Sans JP (ADR 0016).
crate = "okbot-chart"
allow = ["OFL-1.1"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS goes through rustls only.
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# ADR 0005: every dependency comes from crates.io.
allow-git = []
