[package]
name = "okbot-cli"
description = "The okbot command line: create, run and manage chat bots backed by agent CLIs and okbase."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "okbot"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["zalo", "gchat", "discord", "slack", "telegram", "bridge"]
## Zalo Bot Platform channel.
zalo = ["dep:okbot-channel-zalo"]
## Google Chat channel.
gchat = ["dep:okbot-channel-gchat"]
## Discord channel.
discord = ["dep:okbot-channel-discord"]
## Slack channel (Socket Mode).
slack = ["dep:okbot-channel-slack"]
## Telegram channel (long polling or webhook).
telegram = ["dep:okbot-channel-telegram"]
## Adapters in other languages, run as child processes (`docs/bridge.md`).
bridge = ["dep:okbot-channel-bridge"]

[dependencies]
okbot-core.workspace = true
rustls.workspace = true
okbot-agent.workspace = true
okbot-render.workspace = true
okbot-runtime.workspace = true
okbot-knowledge.workspace = true
okbot-store.workspace = true
okbot-channel-console.workspace = true
okbot-config.workspace = true
okbot-channel-zalo = { workspace = true, optional = true }
okbot-channel-gchat = { workspace = true, optional = true }
okbot-channel-discord = { workspace = true, optional = true }
okbot-channel-slack = { workspace = true, optional = true }
okbot-channel-telegram = { workspace = true, optional = true }
okbot-channel-bridge = { workspace = true, optional = true }
inquire.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { workspace = true }
okbase.workspace = true
toml.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
okbot-testkit.workspace = true
tempfile.workspace = true
