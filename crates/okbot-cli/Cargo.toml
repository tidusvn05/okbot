[package]
name = "okbot-cli"
description = "The okbot command line: create, run and manage chat bots backed by agent CLIs and okbase."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "okbot"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["zalo"]
## Zalo Bot Platform channel.
zalo = ["dep:okbot-channel-zalo"]

[dependencies]
okbot-core.workspace = true
okbot-agent.workspace = true
okbot-render.workspace = true
okbot-runtime.workspace = true
okbot-knowledge.workspace = true
okbot-store.workspace = true
okbot-channel-console.workspace = true
okbot-config.workspace = true
okbot-channel-zalo = { workspace = true, optional = true }
inquire.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { workspace = true }
okbase.workspace = true
toml.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
okbot-testkit.workspace = true
tempfile.workspace = true
