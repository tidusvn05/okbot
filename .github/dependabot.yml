version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Must match the version okbase links (libsqlite3-sys can be linked only once).
      - dependency-name: rusqlite
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # 19 uses `cfg_select!`, which needs a newer Rust than the MSRV (1.89).
      - dependency-name: rustyline
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    ignore:
      # Its tags are toolchain versions: `@1.89` is the MSRV job and must stay at the MSRV.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
