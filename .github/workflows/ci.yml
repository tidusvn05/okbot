name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  features:
    # The console-only build and each platform alone must keep compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p okbot --no-default-features
      - run: |
          for f in $(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; m=json.load(sys.stdin); print(" ".join(k for p in m["packages"] if p["name"]=="okbot" for k in p["features"] if k!="default"))'); do
            echo "::group::feature $f"; cargo check -p okbot --no-default-features --features "$f"; echo "::endgroup::"
          done

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/check-deps.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      # `+1.89`: rust-toolchain.toml pins `stable`, which wins over the default the action sets.
      - run: cargo +1.89 check --workspace --all-targets --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  installer:
    # install.sh against a local copy of a release (checksums, layout, options).
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p okbot
      - name: Install from a local release
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          name="okbot-v0.0.0-$target"
          mkdir -p "rel/v0.0.0/$name" home
          cp target/release/okbot "rel/v0.0.0/$name/"
          (cd rel/v0.0.0 && tar -czf "$name.tar.gz" "$name" && rm -r "$name" && shasum -a 256 "$name.tar.gz" > SHA256SUMS)
          HOME="$PWD/home" OKBOT_DOWNLOAD_URL="file://$PWD/rel" sh install.sh --version v0.0.0
          "$PWD/home/.local/bin/okbot" --version
          echo tampered >> "rel/v0.0.0/$name.tar.gz"
          if HOME="$PWD/home" OKBOT_DOWNLOAD_URL="file://$PWD/rel" sh install.sh --version v0.0.0; then
            echo "::error::a tampered archive was installed"; exit 1
          fi
