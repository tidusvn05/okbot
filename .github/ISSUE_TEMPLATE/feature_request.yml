name: Feature request
description: A new platform, agent, command or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How okbot could solve it. For a new platform, link its bot API docs.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
